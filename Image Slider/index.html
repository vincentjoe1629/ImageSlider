<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Auto Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="slider-container">

        <!-- Slide 1 -->
        <div class="my-slides fade">
            <div class="number-text">1 / 4</div>
            <img src="photo1.png" alt="Personal Image 1">
            <div class="caption-text">Caption One</div>
        </div>

    
        <div class="my-slides fade">
            <div class="number-text">2 / 4</div>
            <img src="photo2.png" alt="Personal Image 2">
            <div class="caption-text">Caption Two</div>
        </div>

      
        <div class="my-slides fade">
            <div class="number-text">3 / 4</div>
            <img src="photo3.png" alt="Personal Image 3">
            <div class="caption-text">Caption Three</div>
        </div>


        <div class="my-slides fade">
            <div class="number-text">4 / 4</div>
            <img src="photo4.png" alt="Personal Image 4">
            <div class="caption-text">Caption Four</div>
        </div>

        <!-- Navigation Buttons -->
        <a class="prev" onclick="moveSlide(-1)">&#10094;</a>
        <a class="next" onclick="moveSlide(1)">&#10095;</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
