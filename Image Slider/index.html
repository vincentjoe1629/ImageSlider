<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3Schools Auto Image Slider</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

       
        .slideshow-container {
            max-width: 1000px;
            position: relative;
            margin: auto;
        }

        
        .mySlides {
            display: none;
        }

      
        .mySlides img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            margin-top: -22px;
            padding: 16px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.3);
        }

       
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        
        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        
        .text {
            color: #f2f2f2;
            font-size: 15px;
            padding: 8px 12px;
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
        }

        
        .numbertext {
            color: #f2f2f2;
            font-size: 12px;
            padding: 8px 12px;
            position: absolute;
            top: 0;
        }

        
        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active, .dot:hover {
            background-color: #717171;
        }

      
        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }

        @keyframes fade {
            from { opacity: .4; } 
            to { opacity: 1; }
        }

        
        @media only screen and (max-width: 500px) {
            .prev, .next, .text {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <h2 style="text-align:center">Automatic Image Slideshow</h2>

   
    <div class="slideshow-container">

        
        <div class="mySlides fade">
            <div class="numbertext">1 / 4</div>
            <img src="image1.png" alt="Slide One">
            <div class="text">Caption Text One</div>
        </div>

       
        <div class="mySlides fade">
            <div class="numbertext">2 / 4</div>
            <img src="image2.png" alt="Slide Two">
            <div class="text">Caption Text Two</div>
        </div>

      
        <div class="mySlides fade">
            <div class="numbertext">3 / 4</div>
            <img src="image3.png" alt="Slide Three">
            <div class="text">Caption Text Three</div>
        </div>

       
        <div class="mySlides fade">
            <div class="numbertext">4 / 4</div>
            <img src="image4.png" alt="Slide Four">
            <div class="text">Caption Text Four</div>
        </div>

        
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <br>

    
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span> 
        <span class="dot" onclick="currentSlide(2)"></span> 
        <span class="dot" onclick="currentSlide(3)"></span> 
        <span class="dot" onclick="currentSlide(4)"></span> 
    </div>

   
    <script>
        let slideIndex = 1;
        let timeoutId; 

        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");
            
            if (timeoutId) {
                clearTimeout(timeoutId);
            }

            if (n > slides.length) { slideIndex = 1; }    
            if (n < 1) { slideIndex = slides.length; }
            
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            
            slides[slideIndex-1].style.display = "block";  
            dots[slideIndex-1].className += " active";

            slideIndex++;
            
            timeoutId = setTimeout(function() {
                showSlides(slideIndex);
            }, 4000); 
        }
    </script>

</body>
</html>
